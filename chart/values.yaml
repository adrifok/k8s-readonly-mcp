image:
  repository: k8s-readonly-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Secret created outside Helm, must contain key "token"
authSecretName: k8s-readonly-mcp-auth

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

networkPolicy:
  enabled: true
  # NetworkPolicyPeer list allowed to call port 8000; empty = no in-cluster clients
  allowFrom: []
  # API server endpoint as seen after Service DNAT; minikube default below
  # get it with: kubectl get endpointslice -n default -l kubernetes.io/service-name=kubernetes
  apiServer:
    cidr: 192.168.49.2/32
    port: 8443
