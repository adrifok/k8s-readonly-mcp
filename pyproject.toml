[project]
name = "k8s-readonly-mcp"
version = "0.1.0"
description = "MCP server"
readme = "README.md"
authors = [
    { name = "adrifok", email = "97637423+adrifok@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=37.0.3",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
k8s-readonly-mcp = "k8s_readonly_mcp:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
